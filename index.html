function showModal(html){document.getElementById('modalBody').innerHTML=html+'<div class="actions"><button class="btn full" id="closeModal">닫기</button></div>';document.getElementById('modal').classList.remove('hidden');localizeDom(document.getElementById('modalBody'));document.getElementById('closeModal').onclick=closeModal}

function vehicleMileageSection(){const ym=window.vehicleMonth||month(),[vy,vm]=ym.split('-').map(Number),days=new Date(vy,vm,0).getDate(),trips=data.vehicleTrips.filter(x=>x.date&&x.date.slice(0,7)===ym),byDate=new Map();trips.forEach(x=>{const a=byDate.get(x.date)||{km:0,notes:[]};a.km+=(Number(x.km)||0);if(x.note)a.notes.push(String(x.note));byDate.set(x.date,a)});const total=trips.reduce((a,x)=>a+(Number(x.km)||0),0);let rows='';for(let d=1;d<=days;d++){const date=ym+'-'+String(d).padStart(2,'0'),entry=byDate.get(date),wd=weekdayIndex(date),weekday=weekdayLabels[wd].replace('요일','');rows+='<tr><th class="date"><button class="mileage-day" data-trip-date="'+date+'">'+d+'</button></th><td class="weekday '+(wd===0?'sun':wd===6?'sat':'')+'">'+weekday+'</td><td class="mileage-value"><input class="sheet-input mileage-input" type="number" min="0" step="0.1" inputmode="decimal" aria-label="'+d+'일 운행 거리 km" data-mileage-date="'+date+'" value="'+(entry?Number(entry.km)||0:0)+'"></td><td class="mileage-note">'+esc(entry?Array.from(new Set(entry.notes)).join(' · '):'')+'</td></tr>'}return '<section class="card"><div class="row"><h2>차량 운행 거리</h2><span class="muted">거리 칸에 직접 입력하고 날짜를 눌러 비고를 입력할 수 있습니다.</span></div><div class="row" style="margin-top:12px"><button class="btn" id="vehiclePrev">‹ 이전 달</button><strong>'+vy+'년 '+vm+'월</strong><button class="btn" id="vehicleNext">다음 달 ›</button></div><div class="sheet-wrap mileage-sheet-wrap"><table class="mileage-sheet"><thead><tr><th class="date">일자</th><th class="weekday">요일</th><th>운행 거리 (km)</th><th>비고</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><th class="date" colspan="2">합계</th><td id="mileageTotal">'+fmt(total)+'</td><td></td></tr></tfoot></table></div></section>'}
function bindVehicleMileage(){document.getElementById('vehiclePrev').onclick=()=>{window.vehicleMonth=shiftMonth(window.vehicleMonth||month(),-1);render()};document.getElementById('vehicleNext').onclick=()=>{window.vehicleMonth=shiftMonth(window.vehicleMonth||month(),1);render()};document.querySelectorAll('[data-trip-date]').forEach(b=>b.onclick=()=>vehicleTripForm(b.dataset.tripDate));document.querySelectorAll('[data-mileage-date]').forEach(el=>{el.onchange=()=>{const date=el.dataset.mileageDate,km=Math.max(0,Number(el.value)||0),old=data.vehicleTrips.filter(x=>x.date===date),note=Array.from(new Set(old.map(x=>String(x.note||'').trim()).filter(Boolean))).join(' · ');el.value=String(km);data.vehicleTrips=data.vehicleTrips.filter(x=>x.date!==date);data.vehicleTrips.push({id:old[0]&&old[0].id||uid(),date,km,note});save();const total=data.vehicleTrips.filter(x=>x.date&&x.date.slice(0,7)===(window.vehicleMonth||month())).reduce((a,x)=>a+(Number(x.km)||0),0),out=document.getElementById('mileageTotal');if(out)out.textContent=fmt(total)}})}
function vehicleTripForm(date){const previousDate=typeof date==='string'?date:today(),oldEntries=data.vehicleTrips.filter(x=>x.date===previousDate),oldKm=oldEntries.reduce((a,x)=>a+(Number(x.km)||0),0),oldNotes=oldEntries.map(x=>String(x.note||'').trim()).filter(Boolean),x={date:previousDate,km:oldEntries.length?oldKm:0,note:Array.from(new Set(oldNotes)).join(' · ')},editing=oldEntries.length>0;showModal('<h2>'+(editing?'차량 운행 수정':'차량 운행 기록')+'</h2><form autocomplete="off" id="vehicleTripForm"><div class="field"><label>날짜</label><input required type="date" name="date" value="'+esc(x.date)+'"></div><div class="field"><label>하루 운행 거리 (km)</label><input required type="number" min="0" step="0.1" inputmode="decimal" name="km" value="'+esc(x.km)+'" placeholder="예: 54"></div><div class="field"><label>비고 (선택)</label><textarea name="note">'+esc(x.note)+'</textarea></div><button class="btn primary full">저장</button>'+(editing?'<button type="button" class="btn danger full" id="deleteVehicleTrip" style="margin-top:8px">기록 삭제</button>':'')+'</form>');document.getElementById('vehicleTripForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),km=Number(f.get('km')),newDate=String(f.get('date'));if(!Number.isFinite(km)||km<0){alert('운행 거리를 확인해 주세요.');return}data.vehicleTrips=data.vehicleTrips.filter(item=>item.date!==previousDate&&item.date!==newDate);data.vehicleTrips.push({id:uid(),date:newDate,km,note:String(f.get('note')||'').trim()});save();window.vehicleMonth=newDate.slice(0,7);render()};if(editing)document.getElementById('deleteVehicleTrip').onclick=()=>{if(confirm('이 날짜의 차량 운행 기록을 삭제할까요?')){data.vehicleTrips=data.vehicleTrips.filter(item=>item.date!==previousDate);save();closeModal();render()}}}
function shiftMonth(ym,delta){const [y,m]=ym.split('-').map(Number),d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function logForm(old){if(!old||!old.id){const targetDate=old&&old.date||today();old=data.logs.find(entry=>entry.date===targetDate)||old}const isEditing=Boolean(old&&old.id&&data.logs.some(entry=>entry.id===old.id));const l=isEditing?data.logs.find(entry=>entry.id===old.id):Object.assign({date:today(),hours:0,visits:0,studies:0,note:'',companions:[]},old||{}),vehicleSourceDate=l.date,tripEntries=data.vehicleTrips.filter(x=>x.date===vehicleSourceDate),tripKm=tripEntries.length?tripEntries.reduce((a,x)=>a+(Number(x.km)||0),0):0,tripNote=Array.from(new Set(tripEntries.map(x=>String(x.note||'').trim()).filter(Boolean))).join(' · ');showModal('<h2>'+(isEditing?'봉사 기록 수정':'봉사 기록 추가')+'</h2><form autocomplete="off" id="logForm"><div class="field"><label>날짜</label><input required type="date" name="date" value="'+esc(l.date)+'"></div><div class="field"><label>봉사 시간</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="decimal" required type="number" min="0" step=".25" name="hours" value="'+Number(l.hours||0)+'"></div><div class="field"><label>재방문 건수</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" type="number" min="0" step="1" name="visits" value="'+Number(l.visits||0)+'"></div><div class="field"><label>성서 연구 건수</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" type="number" min="0" step="1" name="studies" value="'+Number(l.studies||0)+'"></div><div class="field"><label>봉사짝 (목록에서 선택, 여러 명 가능)</label>'+Array.from(new Set([...data.partners.filter(p=>!p.archived).map(p=>p.name),...(l.companions||[])])).map(name=>'<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input style="width:auto;min-height:auto" type="checkbox" name="companions" value="'+esc(name)+'" '+((l.companions||[]).includes(name)?'checked':'')+'>'+esc(name)+'</label>').join('')+(data.partners.some(p=>!p.archived)||(l.companions||[]).length?'':'<p class="muted">활성 봉사짝 메뉴에서 등록하세요.</p>')+'</d function personForm(old){const p=old||{id:uid(),name:'',kind:'visit',mapUrl:'',history:[],nextDate:'',nextWeekday:'',nextVisitDate:''},onceDate=nextVisitDate(p),onceWeekday=onceDate?weekdayIndex(onceDate):'';showModal('<h2>'+(old?'대상자 수정':'대상자 추가')+'</h2><form autocomplete="off" id="personForm"><div class="field"><label>이름 또는 별칭</label><input required name="name" value="'+esc(p.name)+'"></div><div class="field"><label>구분</label><select name="kind"><option value="visit" '+(p.kind!=='student'?'selected':'')+'>재방문</option><option value="student" '+(p.kind==='student'?'selected':'')+'>성서 연구생</option></select></div><div class="field"><label>Google 지도 공유 링크</label><input type="url" name="mapUrl" placeholder="https://maps.app.goo.gl/..." value="'+esc(p.mapUrl||'')+'"></div><div class="field"><label>정기 방문 요일</label><select name="nextWeekday"><option value="">요일 미정</option>'+weekdayOrder.map(i=>'<option value="'+i+'" '+(personWeekday(p)===i?'selected':'')+'>'+weekdayLabels[i]+'</option>').join('')+'</select></div><div class="field"><label>다음 방문 요일 (이번 한 번만)</label><select name="nextVisitWeekday"><option value="">임시 일정 없음</option>'+weekdayOrder.map(i=>'<option value="'+i+'" '+(onceWeekday!==''&&Number(onceWeekday)===i?'selected':'')+'>'+weekdayLabels[i]+'</option>').join('')+'</select><div class="muted">선택한 요일 중 오늘 이후 가장 가까운 하루에만 표시됩니다. 그날이 지나면 정기 방문 요일로 돌아옵니다.</div></div><div class="field"><label>메모</label><textarea name="note">'+esc(p.note||'')+'</textarea></div><button class="btn primary full">저장</button></form>');document.getElementById('personForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),selectedOnce=f.get('nextVisitWeekday');Object.assign(p,{name:String(f.get('name')).trim(),kind:f.get('kind'),mapUrl:String(f.get('mapUrl')||'').trim(),nextWeekday:f.get('nextWeekday')===''?'':Number(f.get('nextWeekday')),nextDate:'',nextVisitDate:selectedOnce===''?'':plusDays(today(),(Number(selectedOnce)-weekdayIndex(today())+7)%7),note:String(f.get('note')||'').
