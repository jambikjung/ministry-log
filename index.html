<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17665b">
<title>야외 봉사 기록</title>
<style>
:root{--green:#17665b;--bg:#f4f7f6;--card:#fff;--ink:#172b28;--muted:#667773;--line:#dfe8e5;--soft:#e5f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}header{background:var(--green);color:white;padding:20px 16px 18px;border-radius:0 0 22px 22px}header small{opacity:.8}h1{font-size:23px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #1231}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{background:var(--soft);border-radius:12px;padding:12px 9px;min-width:0}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;margin:7px 0 3px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:0;border-radius:11px;padding:12px 14px;background:#e8efed;color:var(--ink);font-weight:650;font-size:14px;min-height:44px}.primary{background:var(--green);color:#fff}.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions .btn{flex:1}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;gap:2px;background:#fff;border-top:1px solid var(--line);padding:8px 3px calc(8px + env(safe-area-inset-bottom))}nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;padding:8px 2px;border-radius:10px}nav button.active{background:var(--soft);color:var(--green);font-weight:700}nav span{display:block;font-size:19px;margin-bottom:3px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #ccd9d5;border-radius:10px;background:#fff;color:var(--ink);min-height:44px}textarea{min-height:85px;resize:vertical}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.tag{display:inline-block;background:var(--soft);color:var(--green);border-radius:20px;padding:4px 8px;font-size:12px}.progress{height:8px;background:#e7eeeb;border-radius:10px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--green)}.hidden{display:none!important}.note{padding:11px;border-radius:10px;background:#fff7df;color:#66531b;font-size:13px}.small{font-size:12px}.danger{color:#a33333;background:#fff0f0}a{color:var(--green);word-break:break-all}@media(min-width:600px){.wrap{padding:22px}.grid{gap:12px}.card{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><small id="dateLabel">오늘의 봉사</small><h1>야외 봉사 기록</h1><div style="opacity:.9;font-size:13px">오늘의 상황 · 목표 · 방문 기록</div></div></header>
<main class="wrap" id="app"></main>
<nav id="nav"><button class="active" data-tab="home"><span>⌂</span>대시보드</button><button data-tab="logs"><span>＋</span>봉사 기록</button><button data-tab="people"><span>♧</span>대상자</button><button data-tab="goals"><span>◎</span>목표</button><button data-tab="backup"><span>↕</span>백업</button></nav>
<div id="modal" class="hidden" style="position:fixed;inset:0;z-index:20;background:#0007;overflow:auto;padding:12px"><div class="card" style="max-width:600px;margin:20px auto" id="modalBody"></div></div>
<script>
(function(){
'use strict';
const KEY='ministryLogMobileV3';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const month=()=>today().slice(0,7);
const weekStart=()=>{const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const plusDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const empty=()=>({logs:[],people:[],plans:{month:{},week:{}}});
let data;try{data=Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||'{}'));data.plans=Object.assign({month:{},week:{}},data.plans||{});data.logs=data.logs||[];data.people=data.people||[]}catch(e){data=empty()}
let tab='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장 공간에 문제가 있습니다. 백업을 먼저 내려받아 주세요.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(logs,key){return logs.reduce((a,l)=>a+(Number(l[key])||0),0)}
function logsBetween(a,b){return data.logs.filter(l=>l.date>=a&&l.date<=b)}
function periodLogs(type){return type==='month'?data.logs.filter(l=>l.date.slice(0,7)===month()):logsBetween(weekStart(),plusDays(weekStart(),6))}
function plan(type){return data.plans[type][type==='month'?month():weekStart()]||{hours:0,visits:0,studies:0}}
function person(id){return data.people.find(p=>p.id===id)}
function fmt(n){return Number(n||0).toFixed(2).replace(/\.00$/,'')}
function metric(label,actual,target){const rem=Math.max(0,(Number(target)||0)-(Number(actual)||0));const pct=target>0?Math.min(100,actual/target*100):0;return '<div class="metric"><span>'+label+'</span><strong>'+fmt(actual)+'</strong><div class="muted">목표 '+fmt(target)+' · 남음 '+fmt(rem)+'</div><div class="progress"><i style="width:'+pct+'%"></i></div></div>'}
function render(){
document.getElementById('dateLabel').textContent=today()+' · 오늘';
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
const app=document.getElementById('app');
if(tab==='home'){
const day=data.logs.filter(l=>l.date===today()),w=periodLogs('week'),m=periodLogs('month'),wp=plan('week'),mp=plan('month');
const remDays=Math.max(1,7-((new Date(today()+'T12:00:00').getDay()+6)%7));
const monthEnd=new Date(Number(month().slice(0,4)),Number(month().slice(5,7)),0).getDate();
const remMonth=Math.max(1,monthEnd-Number(today().slice(8,10))+1);
const daily=(k)=>Math.max(0,(Number(wp[k])||0)-sum(w,k))/remDays;
const dailyM=(k)=>Math.max(0,(Number(mp[k])||0)-sum(m,k))/remMonth;
app.innerHTML='<section class="card"><div class="row"><div><h2>오늘의 상황</h2><div class="muted">'+today()+' 실적</div></div><button class="btn primary" id="quickLog">＋ 기록 추가</button></div><div class="grid" style="margin-top:12px">'+metric('봉사 시간',sum(day,'hours'),Math.max(daily('hours'),dailyM('hours')))+metric('재방문',sum(day,'visits'),Math.max(daily('visits'),dailyM('visits')))+metric('성서 연구',sum(day,'studies'),Math.max(daily('studies'),dailyM('studies'))).replace(/\.00/g,'')+'</div><p class="muted">오늘 권장량은 남은 주간·월간 목표를 남은 날짜로 나눈 평균 중 더 높은 값입니다.</p></section>'+
'<section class="card"><h2>이번 주 진행 상황</h2><div class="grid">'+metric('시간',sum(w,'hours'),wp.hours)+metric('재방문',sum(w,'visits'),wp.visits)+metric('연구',sum(w,'studies'),wp.studies)+'</div></section>'+
'<section class="card"><h2>이번 달 진행 상황</h2><div class="grid">'+metric('시간',sum(m,'hours'),mp.hours)+metric('재방문',sum(m,'visits'),mp.visits)+metric('연구',sum(m,'studies'),mp.studies)+'</div></section>'+
'<section class="card"><div class="row"><h2>오늘의 후속 방문</h2><button class="btn" id="goPeople">대상자 보기</button></div>'+followups()+'</section>'+
'<section class="actions"><button class="btn primary" id="quickGoal">목표 수정</button><button class="btn" id="quickPeople">방문 기록 추가</button></section>';
document.getElementById('quickLog').onclick=()=>logForm();
document.getElementById('quickGoal').onclick=()=>{tab='goals';render()};
document.getElementById('goPeople').onclick=()=>{tab='people';render()};
document.getElementById('quickPeople').onclick=()=>{tab='people';render();personForm()};
}else if(tab==='logs'){
app.innerHTML='<section class="card"><div class="row"><h2>봉사 기록</h2><button class="btn primary" id="addLog">＋ 추가</button></div><p class="muted">시간은 소수로 입력할 수 있습니다. 예: 1시간 30분 = 1.5</p>'+data.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>'<div class="item"><div class="row"><strong>'+esc(l.date)+'</strong><button class="btn small" data-edit-log="'+l.id+'">수정</button></div><div style="margin:7px 0">시간 <b>'+fmt(l.hours)+'</b> · 재방문 <b>'+fmt(l.visits)+'</b> · 연구 <b>'+fmt(l.studies)+'</b></div><div class="muted">'+esc(l.note||'')+'</div></div>').join('')+'<div id="emptyLogs" class="muted '+(data.logs.length?'hidden':'')+'">아직 봉사 기록이 없습니다.</div></section>';
document.getElementById('addLog').onclick=()=>logForm();
document.querySelectorAll('[data-edit-log]').forEach(b=>b.onclick=()=>logForm(data.logs.find(l=>l.id===b.dataset.editLog)));
}else if(tab==='people'){
app.innerHTML='<section class="card"><div class="row"><h2>재방문 · 성서 연구생</h2><button class="btn primary" id="addPerson">＋ 대상자</button></div><p class="muted">대상자별 방문 이력과 Google 지도 링크를 관리합니다.</p>'+data.people.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<div class="item"><div class="row"><div><strong>'+esc(p.name)+'</strong> <span class="tag">'+(p.kind==='student'?'성서 연구생':'재방문')+'</span></div><button class="btn small" data-person="'+p.id+'">열기</button></div><div class="muted">'+(p.history||[]).length+'건의 방문 기록'+(p.mapUrl?' · <a target="_blank" rel="noopener" href="'+esc(p.mapUrl)+'">지도 열기</a>':'')+'</div></div>').join('')+'<div class="muted '+(data.people.length?'hidden':'')+'">대상자를 추가해 방문 기록을 시작하세요.</div></section>';
document.getElementById('addPerson').onclick=()=>personForm();
document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>personDetail(person(b.dataset.person)));
}else if(tab==='goals'){
const wp=plan('week'),mp=plan('month');
app.innerHTML='<section class="card"><h2>목표 계획</h2><p class="muted">이번 주와 이번 달 목표를 설정하세요. 계획은 언제든 수정할 수 있고 기존 실적은 유지됩니다.</p><form id="goalForm"><h3>이번 주 · '+weekStart()+' 시작</h3>'+goalFields('w',wp)+'<h3 style="margin-top:20px">이번 달 · '+month()+'</h3>'+goalFields('m',mp)+'<button class="btn primary full" style="margin-top:12px">계획 저장</button></form></section>';
document.getElementById('goalForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);['w','m'].forEach((x,i)=>{const type=i?'month':'week',key=i?month():weekStart();data.plans[type][key]={hours:Math.max(0,Number(f.get(x+'hours')||0)),visits:Math.max(0,Number(f.get(x+'visits')||0)),studies:Math.max(0,Number(f.get(x+'studies')||0))}});save();tab='home';render();alert('목표를 저장했습니다.')};
}else{
app.innerHTML='<section class="card"><h2>백업 및 복원</h2><p class="muted">이 기기 브라우저에 기록이 저장됩니다. 다른 기기로 옮길 때 JSON 백업을 사용하세요.</p><div class="actions"><button class="btn primary" id="export">백업 다운로드</button><button class="btn" id="import">백업 가져오기</button></div><input type="file" id="fileInput" accept=".json,application/json" class="hidden"><div class="note" style="margin-top:14px">개별 방문 내용과 지도 링크는 민감한 개인 정보일 수 있습니다. 공개 저장소나 공개 웹페이지에 기록하지 마세요.</div><p class="muted" style="margin-top:12px">현재는 자동 기기 동기화가 없습니다. Safari에서 열어도 브라우저 데이터가 초기화되면 기록이 사라질 수 있으니 정기적으로 백업하세요.</p></section>';
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ministry-log-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('import').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.logs)||!Array.isArray(x.people))throw Error();if(confirm('현재 데이터를 가져온 백업으로 교체할까요?')){data=x;data.plans=data.plans||{month:{},week:{}};save();render();alert('복원했습니다.')}}catch(err){alert('올바른 앱 JSON 백업 파일이 아닙니다.')}};reader.readAsText(file)};
}
}
function goalFields(p,v){return '<div class="field"><label>봉사 시간</label><input name="'+p+'hours" type="number" min="0" step=".25" value="'+Number(v.hours||0)+'"></div><div class="field"><label>재방문 건수</label><input name="'+p+'visits" type="number" min="0" step="1" value="'+Number(v.visits||0)+'"></div><div class="field"><label>성서 연구 건수</label><input name="'+p+'studies" type="number" min="0" step="1" value="'+Number(v.studies||0)+'"></div>'}
function followups(){const list=data.people.filter(p=>p.nextDate&&p.nextDate<=today());return list.length?list.map(p=>'<div class="item"><strong>'+esc(p.name)+'</strong> · '+esc(p.nextDate)+' <button class="btn small" data-follow="'+p.id+'">기록</button></div>').join(''):'<p class="muted">오늘 예정된 후속 방문이 없습니다. 대상자별 다음 방문일을 설정할 수 있습니다.</p>'}
function showModal(html){document.getElementById('modalBody').innerHTML=html+'<div class="actions"><button class="btn full" id="closeModal">닫기</button></div>';document.getElementById('modal').classList.remove('hidden');document.getElementById('closeModal').onclick=closeModal}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modalBody').innerHTML=''}
function logForm(old){const l=old||{date:today(),hours:0,visits:0,studies:0,note:''};showModal('<h2>'+ (old?'봉사 기록 수정':'봉사 기록 추가')+'</h2><form id="logForm"><div class="field"><label>날짜</label><input required type="date" name="date" value="'+esc(l.date)+'"></div><div class="field"><label>봉사 시간</label><input required type="number" min="0" step=".25" name="hours" value="'+Number(l.hours||0)+'"></div><div class="field"><label>재방문 건수</label><input type="number" min="0" step="1" name="visits" value="'+Number(l.visits||0)+'"></div><div class="field"><label>성서 연구 건수</label><input type="number" min="0" step="1" name="studies" value="'+Number(l.studies||0)+'"></div><div class="field"><label>메모</label><textarea name="note">'+esc(l.note||'')+'</textarea></div><button class="btn primary full">저장</button>'+(old?'<button type="button" class="btn danger full" id="delLog" style="margin-top:8px">기록 삭제</button>':'')+'</form>');document.getElementById('logForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={id:l.id||uid(),date:f.get('date'),hours:Number(f.get('hours')||0),visits:Number(f.get('visits')||0),studies:Number(f.get('studies')||0),note:String(f.get('note')||'').trim()};if(old)Object.assign(old,obj);else data.logs.push(obj);save();closeModal();render()};if(old)document.getElementById('delLog').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){data.logs=data.logs.filter(x=>x.id!==old.id);save();closeModal();render()}}}
function personForm(old){const p=old||{id:uid(),name:'',kind:'visit',mapUrl:'',history:[],nextDate:''};showModal('<h2>'+(old?'대상자 수정':'대상자 추가')+'</h2><form id="personForm"><div class="field"><label>이름 또는 별칭</label><input required name="name" value="'+esc(p.name)+'"></div><div class="field"><label>구분</label><select name="kind"><option value="visit" '+(p.kind!=='student'?'selected':'')+'>재방문</option><option value="student" '+(p.kind==='student'?'selected':'')+'>성서 연구생</option></select></div><div class="field"><label>Google 지도 공유 링크</label><input type="url" name="mapUrl" placeholder="https://maps.app.goo.gl/..." value="'+esc(p.mapUrl||'')+'"></div><div class="field"><label>다음 방문 예정일 (선택)</label><input type="date" name="nextDate" value="'+esc(p.nextDate||'')+'"></div><div class="field"><label>메모</label><textarea name="note">'+esc(p.note||'')+'</textarea></div><button class="btn primary full">저장</button></form>');document.getElementById('personForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(p,{name:String(f.get('name')).trim(),kind:f.get('kind'),mapUrl:String(f.get('mapUrl')||'').trim(),nextDate:f.get('nextDate'),note:String(f.get('note')||'').trim()});if(!data.people.some(x=>x.id===p.id))data.people.push(p);save();closeModal();render()}}
function personDetail(p){if(!p)return;const hist=(p.history||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));showModal('<h2>'+esc(p.name)+'</h2><div class="row"><span class="tag">'+(p.kind==='student'?'성서 연구생':'재방문')+'</span><button class="btn small" id="editPerson">정보 수정</button></div>'+(p.mapUrl?'<p><a href="'+esc(p.mapUrl)+'" target="_blank" rel="noopener">Google 지도에서 위치 열기 ↗</a></p>':'<p class="muted">지도 링크가 없습니다. 정보 수정에서 추가할 수 있습니다.</p>')+'<p class="muted">'+esc(p.note||'')+'</p><h3 style="margin-top:16px">개별 방문 기록</h3>'+hist.map(h=>'<div class="item"><div class="row"><strong>'+esc(h.date)+'</strong><span class="tag">'+(h.met==='yes'?'만남':'만나지 못함')+'</span></div><p>'+esc(h.discussion||'내용 없음')+'</p><div class="muted">다음 계획: '+esc(h.nextStep||'—')+'</div><button class="btn small" data-edit-history="'+h.id+'">수정</button></div>').join('')+'<button class="btn primary full" id="addHistory" style="margin-top:12px">＋ 방문 기록 추가</button><button class="btn danger full" id="deletePerson" style="margin-top:8px">대상자 삭제</button>');document.getElementById('editPerson').onclick=()=>personForm(p);document.getElementById('addHistory').onclick=()=>historyForm(p);document.querySelectorAll('[data-edit-history]').forEach(b=>b.onclick=()=>historyForm(p,hist.find(h=>h.id===b.dataset.editHistory)));document.getElementById('deletePerson').onclick=()=>{if(confirm('대상자와 방문 이력을 모두 삭제할까요?')){data.people=data.people.filter(x=>x.id!==p.id);save();closeModal();render()}}}
function historyForm(p,old){const h=old||{id:uid(),date:today(),met:'yes',discussion:'',nextStep:''};showModal('<h2>'+esc(p.name)+' · 방문 기록</h2><form id="historyForm"><div class="field"><label>방문 날짜</label><input required type="date" name="date" value="'+esc(h.date)+'"></div><div class="field"><label>방문 결과</label><select name="met"><option value="yes" '+(h.met!=='no'?'selected':'')+'>만남</option><option value="no" '+(h.met==='no'?'selected':'')+'>만나지 못함</option></select></div><div class="field"><label>대화 내용 / 방문 결과</label><textarea name="discussion">'+esc(h.discussion||'')+'</textarea></div><div class="field"><label>다음 방문 계획</label><textarea name="nextStep">'+esc(h.nextStep||'')+'</textarea></div><button class="btn primary full">방문 기록 저장</button></form>');document.getElementById('historyForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(h,{date:f.get('date'),met:f.get('met'),discussion:String(f.get('discussion')||'').trim(),nextStep:String(f.get('nextStep')||'').trim()});if(!old){p.history=p.history||[];p.history.push(h)}save();personDetail(p)}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
})();
</script>
</body></html>
