<body>
<header><div class="wrap" style="padding:0"><small id="dateLabel">오늘의 봉사</small><h1>야외 봉사 기록</h1><div style="opacity:.9;font-size:13px">오늘의 상황 · 목표 · 방문 기록</div></div></header>

<div id="modal" class="hidden" style="position:fixed;inset:0;z-index:20;background:#0007;overflow:auto;padding:12px"><div class="card" style="max-width:600px;margin:20px auto" id="modalBody"></div></div>
<script>
(function(){
'use strict';
const KEY='ministryLogMobileV3';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const month=()=>today().slice(0,7);
const weekdayIndex=(date)=>new Date(Date.UTC(Number(date.slice(0,4)),Number(date.slice(5,7))-1,Number(date.slice(8,10)))).getUTCDay();
const weekdayLabels=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
const personWeekday=p=>p.nextWeekday!==undefined&&p.nextWeekday!==null&&p.nextWeekday!==''&&Number.isInteger(Number(p.nextWeekday))?Number(p.nextWeekday):(p.nextDate?weekdayIndex(p.nextDate):-1);
const weekStart=()=>{const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const plusDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const empty=()=>({logs:[],people:[],partners:[],calendarPlans:{},monthCompanions:{},monthRates:{},calendarView:'calendar',plans:{month:{},week:{}}});
let data;try{data=Object.assign(empty(),JSON.parse(localStorage.getItem(KEY)||'{}'));data.plans=Object.assign({month:{},week:{}},data.plans||{});data.logs=data.logs||[];data.people=data.people||[];data.partners=data.partners||[];data.calendarPlans=data.calendarPlans||{};data.monthCompanions=data.monthCompanions||{};data.monthRates=data.monthRates||{}}catch(e){data=empty()}
const loadedLogCount=data.logs.length;data.logs=normalizeDailyLogs(data.logs);
let tab='home';
function normalizeDailyLogs(logs){const grouped=new Map();(logs||[]).forEach(log=>{if(!log||!log.date)return;const current=grouped.get(log.date);if(!current){grouped.set(log.date,Object.assign({},log,{hours:Number(log.hours)||0,visits:Number(log.visits)||0,studies:Number(log.studies)||0,companions:recordCompanions([log]),note:String(log.note||'').trim()}));return}current.hours+=(Number(log.hours)||0);current.visits+=(Number(log.visits)||0);current.studies+=(Number(log.studies)||0);current.companions=Array.from(new Set([...recordCompanions([current]),...recordCompanions([log])]));current.note=Array.from(new Set([current.note,String(log.note||'').trim()].filter(Boolean))).join(' · ')});return Array.from(grouped.values())}
function save(){try{data.logs=normalizeDailyLogs(data.logs);localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장 공간에 문제가 있습니다. 백업을 먼저 내려받아 주세요.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(logs,key){return logs.reduce((a,l)=>a+(Number(l[key])||0),0)}
function recordCompanions(logs){return Array.from(new Set(logs.flatMap(l=>Array.isArray(l.companions)?l.companions:String(l.companions||'').split(',').map(x=>x.trim()).filter(Boolean))))}
if(data.logs.length!==loadedLogCount)save();
function logsBetween(a,b){return data.logs.filter(l=>l.date>=a&&l.date<=b)}
function periodLogs(type){return type==='month'?data.logs.filter(l=>l.date.slice(0,7)===month()):logsBetween(weekStart(),plusDays(weekStart(),6))}
function plan(type){return data.plans[type][type==='month'?month():weekStart()]||{hours:0,visits:0,studies:0}}
function person(id){return data.people.find(p=>p.id===id)}
function fmt(n){return Number(n||0).toFixed(2).replace(/\.00$/,'')}
function metric(label,actual,target){const rem=Math.max(0,(Number(target)||0)-(Number(actual)||0));const pct=target>0?Math.min(100,actual/target*100):0;return '<div class="metric"><span>'+label+'</span><strong>'+fmt(actual)+'</strong><div class="muted">목표 '+fmt(target)+' · 남음 '+fmt(rem)+'</div><div class="progress"><i style="width:'+pct+'%"></i></div></div>'}
function render(){
document.getElementById('dateLabel').textContent=today()+' · 오늘';

if(tab==='home'){

'<section class="card"><h2>이번 달 진행 상황</h2><div class="grid">'+metric('시간',sum(m,'hours'),mp.hours)+metric('재방문',sum(m,'visits'),mp.visits)+metric('연구',sum(m,'studies'),mp.studies)+'</div></section>'+

document.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>historyForm(person(b.dataset.study)));document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>historyForm(person(b.dataset.follow)));

document.getElementById('goPeople').onclick=()=>{tab='people';render()};

}else if(tab==='logs'){
app.innerHTML='<section class="card"><div class="row"><h2>봉사 기록</h2><button class="btn primary" id="addLog">'+(data.logs.some(l=>l.date===today())?'오늘 기록 수정':'오늘 기록 입력')+'</button></div><p class="muted">시간은 소수로 입력할 수 있습니다. 예: 1시간 30분 = 1.5</p>'+data.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>'<div class="item"><div class="row"><strong>'+esc(l.date)+'</strong><button class="btn small" data-edit-log="'+l.id+'">수정</button></div><div style="margin:7px 0">시간 <b>'+fmt(l.hours)+'</b> · 재방문 <b>'+fmt(l.visits)+'</b> · 연구 <b>'+fmt(l.studies)+'</b></div><div class="muted">봉사짝: '+esc((l.companions||[]).join(', ')||'미기록')+'</div><div class="muted">'+esc(l.note||'')+'</div></div>').join('')+'<div id="emptyLogs" class="muted '+(data.logs.length?'hidden':'')+'">아직 봉사 기록이 없습니다.</div></section>';
document.getElementById('addLog').onclick=()=>logForm();
document.querySelectorAll('[data-edit-log]').forEach(b=>b.onclick=()=>logForm(data.logs.find(l=>l.id===b.dataset.editLog)));
}else if(tab==='people'){
app.innerHTML='<section class="card"><div class="row"><h2>재방문 · 성서 연구생</h2><button class="btn primary" id="addPerson">＋ 대상자</button></div><p class="muted">대상자별 방문 이력과 Google 지도 링크를 관리합니다.</p>'+data.people.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<div class="item"><div class="row"><div><strong>'+esc(p.name)+'</strong> <span class="tag">'+(p.kind==='student'?'성서 연구생':'재방문')+'</span></div><button class="btn small" data-person="'+p.id+'">열기</button></div><div class="muted">'+(p.history||[]).length+'건의 방문 기록'+(personWeekday(p)>=0?' · 매주 '+weekdayLabels[personWeekday(p)]:'')+(p.mapUrl?' · <a target="_blank" rel="noopener" href="'+esc(p.mapUrl)+'">지도 열기</a>':'')+'</div></div>').join('')+'<div class="muted '+(data.people.length?'hidden':'')+'">대상자를 추가해 방문 기록을 시작하세요.</div></section>';

}else if(tab==='partners'){
app.innerHTML='<section class="card"><div class="row"><h2>봉사짝 관리</h2><button class="btn primary" id="addPartner">＋ 봉사짝</button></div><p class="muted">함께 봉사하는 사람을 등록하고, 봉사 기록에 이름을 입력해 동행 이력을 관리하세요.</p>'+data.partners.map(p=>'<div class="item"><div class="row"><strong>'+esc(p.name)+'</strong><button class="btn small" data-edit-partner="'+p.id+'">수정</button></div><div class="muted">'+data.logs.filter(l=>(l.companions||[]).includes(p.name)).length+'회 함께 봉사</div>'+(p.note?'<div class="muted">'+esc(p.note)+'</div>':'')+'</div>').join('')+'<div class="muted '+(data.partners.length?'hidden':'')+'">아직 등록된 봉사짝이 없습니다.</div></section>';
document.getElementById('addPartner').onclick=()=>partnerForm();
document.querySelectorAll('[data-edit-partner]').forEach(b=>b.onclick=()=>partnerForm(data.partners.find(p=>p.id===b.dataset.editPartner)));
}else if(tab==='calendar'){
const [yy,mm]=month().split('-').map(Number),rawYear=Number(window.calYear),rawMonth=Number(window.calMonth),sy=Number.isInteger(rawYear)&&rawYear>=1?rawYear:yy,sm=Number.isInteger(rawMonth)&&rawMonth>=1&&rawMonth<=12?rawMonth:mm,ym=String(sy).padStart(4,'0')+'-'+String(sm).padStart(2,'0'),first=new Date(sy,sm-1,1).getDay(),days=new Date(sy,sm,0).getDate(),monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
let cells='';for(let i=0;i<first;i++)cells+='<div class="calday empty"></div>';for(let d=1;d<=days;d++){const ds=ym+'-'+String(d).padStart(2,'0'),p=data.calendarPlans[ds]||{},dayLogs=data.logs.filter(l=>l.date===ds),actualCompanions=recordCompanions(dayLogs);cells+='<button class="calday'+(ds===today()?' today':'')+(p.plan||p.note||p.hours||p.visits||p.studies?' hasplan':'')+'" data-calday="'+ds+'"><span class="num">'+d+'</span><span class="mini">계획: '+esc(p.plan||'—')+'</span><span class="mini">계획: '+fmt(p.hours||0)+'시간 · 재방문 '+fmt(p.visits||0)+' · 연구 '+fmt(p.studies||0)+'</span><span class="mini">실적: '+(dayLogs.length?fmt(sum(dayLogs,'hours'))+'시간 · 재방문 '+fmt(sum(dayLogs,'visits'))+' · 연구 '+fmt(sum(dayLogs,'studies')):'없음')+'</span>'+(p.companions&&p.companions.length?'<span class="mini">계획 짝: '+esc(p.companions.join(', '))+'</span>':'')+(actualCompanions.length?'<span class="mini">실제 짝: '+esc(actualCompanions.join(', '))+'</span>':'')+(p.note?'<span class="mini">메모: '+esc(p.note)+'</span>':'')+'</button>'}
const ml=data.logs.filter(l=>l.date.slice(0,7)===ym),mp=data.plans.month[ym]||{hours:0,visits:0,studies:0},view=data.calendarView==='table'?'table':'calendar';

document.getElementById('calYear').onchange=e=>{window.calYear=Number(e.target.value);window.calMonth=sm;render()};

><tbody>'+rows+'</tbody><tfoot><tr><th colspan="2">합계</th>'+['hours','visits','studies'].map(k=>'<td>'+fmt(cp[k])+'</td>').join('')+['hours','visits','studies'].map(k=>'<td>'+fmt(ca[k])+'</td>').join('')+'<td></td>'+['hours','visits','studies'].map(k=>'<td class="diff '+(cp[k]-ca[k]>0?'behind':cp[k]-ca[k]<0?'ahead':'')+'">'+fmt(cp[k]-ca[k])+'</td>').join('')+'</tr></tfoot></table></div><style>.sheet-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}.plan-sheet{width:100%;min-width:610px;border-collapse:collapse;font-size:12px;table-layout:auto}.plan-sheet th,.plan-sheet td{border:1px solid var(--line);padding:6px 7px;text-align:right;white-space:nowrap}.plan-sheet thead th{background:var(--soft);color:var(--green);text-align:center;font-weight:700}.plan-sheet th.date,.plan-sheet th.weekday{background:#f6f8f7;color:var(--ink);text-align:center;min-width:32px}.plan-sheet .memo{white-space:normal;text-align:left;min-width:95px;max-width:150px}.plan-sheet .daily td{background:var(--card)}.plan-sheet .running td{background:var(--soft);font-weight:700}.plan-sheet .running{border-bottom:2px solid var(--green)}.plan-sheet .diff{color:var(--muted)}.plan-sheet .diff.behind{color:#b42318}.plan-sheet .diff.ahead{color:var(--green)}.plan-sheet tfoot th,.plan-sheet tfoot td{background:var(--soft);font-weight:800;border-top:2px solid var(--green)}.plan-sheet tbody tr{cursor:pointer}</style>'}
function monthRatesForm(ym){const r=data.monthRates[ym]||{visits:0,studies:0};showModal('<h2>'+esc(ym)+' 시간당 목표</h2><p class="muted">계획 시간에 시간당 목표를 곱합니다. 소수 결과는 반올림합니다.</p><form autocomplete="off" id="monthRatesForm"><div class="field"><label>시간당 재방문 건수</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="decimal" name="visits" type="number" min="0" step="0.1" value="'+Number(r.visits||0)+'"></div><div class="field"><label>시간당 성서 연구 건수</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="decimal" name="studies" type="number" min="0" step="0.1" value="'+Number(r.studies||0)+'"></div><button class="btn primary full">저장 및 계획 다시 계산</button></form>');document.getElementById('monthRatesForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.monthRates[ym]={visits:Number(f.get('visits')||0),studies:Number(f.get('studies')||0)};for(const [date,p] of Object.entries(data.calendarPlans)){if(date.slice(0,7)===ym){const h=Number(p.hours)||0;p.visits=Math.round(h*data.monthRates[ym].visits);p.studies=Math.round(h*data.monthRates[ym].studies)}}save();closeModal();render()}}
function monthlyPartnersForm(ym){const selected=data.monthCompanions[ym]||[];showModal('<h2>'+esc(ym)+' 봉사짝 계획</h2><p class="muted">이번 달 함께 봉사하기로 한 봉사짝을 선택하세요.</p><form autocomplete="off" id="monthPartnerForm">'+data.partners.map(p=>'<label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input style="width:auto;min-height:auto" type="checkbox" name="names" value="'+esc(p.name)+'" '+(selected.includes(p.name)?'checked':'')+'>'+esc(p.name)+'</label>').join('')+'<button class="btn primary full">저장</button></form>');document.getElementById('monthPartnerForm').onsubmit=e=>{e.preventDefault();data.monthCompanions[ym]=new FormData(e.target).getAll('names');save();closeModal();render()}}
function followups(){const dow=weekdayIndex(today()),list=data.people.filter(p=>personWeekday(p)===dow).sort((a,b)=>a.name.localeCompare(b.name,'ko'));return list.length?list.map(p=>'<div class="item"><div class="row"><div><strong>'+esc(p.name)+'</strong> <span class="tag">'+(p.kind==='student'?'성서 연구':'재방문')+'</span></div><button class="btn small" data-follow="'+esc(p.id)+'">방문 기록</button></div><div class="muted">매주 '+weekdayLabels[dow]+' 방문 예정</div></div>').join(''):'<p class="muted">오늘 예정된 정기 재방문·성서 연구가 없습니다.</p>'}
function showModal(html){document.getElementById('modalBody').innerHTML=html+'<div class="actions"><button class="btn full" id="closeModal">닫기</button></div>';document.getElementById('modal').classList.remove('hidden');document.getElementById('closeModal').onclick=closeModal}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modalBody').innerHTML=''}
function logForm(old){if(!old||!old.id){const targetDate=old&&old.date||today();old=data.logs.find(entry=>entry.date===targetDate)||old}const isEditing=Boolean(old&&old.id&&data.logs.some(entry=>entry.id===old.id));const l=isEditing?data.logs.find(entry=>entry.id===old.id):Object.assign({date:today(),hours:0,visits:0,studies:0,note:'',companions:[]},old||{});showModal('<h2>'+ (isEditing?'봉사 기록 수정':'봉사 기록 추가')+'</h2><form autocomplete="off" id="logForm"><div class="field"><label>날짜</label><input required type="date" name="date" value="'+esc(l.date)+'"></div><div class="field"><label>봉사 시간</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="decimal" required type="number" min="0" step=".25" name="hours" value="'+Number(l.hours||0)+'"></div><div class="field"><label>재방문 건수</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" type="number" min="0" step="1" name="visits" value="'+Number(l.visits||0)+'"></div><div class="field"><label>성서 연구 건수</label><input autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" type="number" min="0" step="1" name="studies" value="'+Number(l.studies||0)+'"></div><div class="field"><label>봉사짝 (목록에서 선택, 여러 명 가능)</label>'+Array.from(new Set([...data.partners.map(p=>p.name),...(l.companions||[])])).map(name=>'<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input style="width:auto;min-height:auto" type="checkbox" name="companions" value="'+esc(name)+'" '+((l.companions||[]).includes(name)?'checked':'')+'>'+esc(name)+'</label>').join('')+(data.partners.length||(l.companions||[]).length?'':'<p class="muted">봉사짝 메뉴에서 먼저 등록하세요.</p>')+'</div><div class="field"><label>메모</label><textarea name="note">'+esc(l.note||'')+'</textarea></div><button class="btn primary full">저장</button>'+(isEditing?'<button type="button" class="btn danger full" id="delLog" style="margin-top:8px">기록 삭제</button>':'')+'</form>');document.getElementById('logForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={id:l.id||uid(),date:f.get('date'),hours:Number(f.get('hours')||0),visits:Number(f.get('visits')||0),studies:Number(f.get('studies')||0),companions:f.getAll('companions'),note:String(f.get('note')||'').trim()};if(isEditing){const duplicate=data.logs.find(entry=>entry.date===obj.date&&entry.id!==l.id);if(duplicate){alert('이 날짜에는 이미 봉사 기록이 있습니다. 해당 날짜의 기존 기록을 수정해 주세요.');return}Object.assign(l,obj)}else{const sameDay=data.logs.find(entry=>entry.date===obj.date);if(sameDay)Object.assign(sameDay,Object.assign({},obj,{id:sameDay.id}));else data.logs.push(obj)}save();closeModal();render()};if(isEditing)document.getElementById('delLog').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){data.logs=data.logs.filter(x=>x.id!==l.id);save();closeModal();render()}}}
function personForm(old){const p=old||{id:uid(),name:'',kind:'visit',mapUrl:'',history:[],nextDate:'',nextWeekday:''};showModal('<h2>'+(old?'대상자 수정':'대상자 추가')+'</h2><form autocomplete="off" id="personForm"><div class="field"><label>이름 또는 별칭</label><input required name="name" value="'+esc(p.name)+'"></div><div class="field"><label>구분</label><select name="kind"><option value="visit" '+(p.kind!=='student'?'selected':'')+'>재방문</option><option value="student" '+(p.kind==='student'?'selected':'')+'>성서 연구생</option></select></div><div class="field"><label>Google 지도 공유 링크</label><input type="url" name="mapUrl" placeholder="https://maps.app.goo.gl/..." value="'+esc(p.mapUrl||'')+'"></div><div class="field"><label>정기 방문 요일</label><select name="nextWeekday"><option value="">요일 미정</option>'+weekdayLabels.map((d,i)=>'<option value="'+i+'" '+(personWeekday(p)===i?'selected':'')+'>'+d+'</option>').join('')+'</select></div><div class="field"><label>메모</label><textarea name="note">'+esc(p.note||'')+'</textarea></div><button class="btn primary full">저장</button></form>');document.getElementById('personForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(p,{name:String(f.get('name')).trim(),kind:f.get('kind'),mapUrl:String(f.get('mapUrl')||'').trim(),nextWeekday:f.get('nextWeekday')===''?'':Number(f.get('nextWeekday')),nextDate:'',note:String(f.get('note')||'').trim()});if(!data.people.some(x=>x.id===p.id))data.people.push(p);save();closeModal();render()}}
function personDetail(p){if(!p)return;const hist=(p.history||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));showModal('<h2>'+esc(p.name)+'</h2><div class="row"><span class="tag">'+(p.kind==='student'?'성서 연구생':'재방문')+'</span><button class="btn small" id="editPerson">정보 수정</button></div>'+(p.mapUrl?'<p><a href="'+esc(p.mapUrl)+'" target="_blank" rel="noopener">Google 지도에서 위치 열기 ↗</a></p>':'<p class="muted">지도 링크가 없습니다. 정보 수정에서 추가할 수 있습니다.</p>')+'<p class="muted">'+esc(p.note||'')+'</p>'+(personWeekday(p)>=0?'<p class="muted">정기 방문: 매주 '+weekdayLabels[personWeekday(p)]+'</p>':'')+'<h3 style="margin-top:16px">개별 방문 기록</h3>'+hist.map(h=>'<div class="item"><div class="row"><strong>'+esc(h.date)+'</strong><span class="tag">'+(h.met==='yes'?'만남':'만나지 못함')+'</span></div><p>'+esc(h.discussion||'내용 없음')+'</p><div class="muted">다음 계획: '+esc(h.nextStep||'—')+'</div><button class="btn small" data-edit-history="'+h.id+'">수정</button></div>').join('')+'<button class="btn primary full" id="addHistory" style="margin-top:12px">＋ 방문 기록 추가</button><button class="btn danger full" id="deletePerson" style="margin-top:8px">대상자 삭제</button>');document.getElementById('editPerson').onclick=()=>personForm(p);document.getElementById('addHistory').onclick=()=>historyForm(p);document.querySelectorAll('[data-edit-history]').forEach(b=>b.onclick=()=>historyForm(p,hist.find(h=>h.id===b.dataset.editHistory)));document.getElementById('deletePerson').onclick=()=>{if(confirm('대상자와 방문 이력을 모두 삭제할까요?')){data.people=data.people.filter(x=>x.id!==p.id);save();closeModal();render()}}}
function historyForm(p,old){const h=old||{id:uid(),date:today(),met:'yes',discussion:'',nextStep:''};showModal('<h2>'+esc(p.name)+' · 방문 기록</h2><form autocomplete="off" id="historyForm"><div class="field"><label>방문 날짜</label><input required type="date" name="date" value="'+esc(h.date)+'"></div>'+(old?'':'<div class="field"><label>다음 정기 방문 요일 (선택)</label><select name="nextWeekday"><option value="">요일 미정</option>'+weekdayLabels.map((d,i)=>'<option value="'+i+'" '+(personWeekday(p)===i?'selected':'')+'>'+d+'</option>').join('')+'</select></div>')+'<div class="field"><label>방문 결과</label><select name="met"><option value="yes" '+(h.met!=='no'?'selected':'')+'>만남</option><option value="no" '+(h.met==='no'?'selected':'')+'>만나지 못함</option></select></div><div class="field"><label>대화 내용 / 방문 결과</label><textarea name="discussion">'+esc(h.discussion||'')+'</textarea></div><div class="field"><label>다음 방문 계획</label><textarea name="nextStep">'+esc(h.nextStep||'')+'</textarea></div><button class="btn primary full">방문 기록 저장</button></form>');document.getElementById('historyForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(h,{date:f.get('date'),met:f.get('met'),discussion:String(f.get('discussion')||'').trim(),nextStep:String(f.get('nextStep')||'').trim()});if(!old){p.history=p.history||[];p.history.push(h);p.nextWeekday=f.get('nextWeekday')===''?'':Number(f.get('nextWeekday'));p.nextDate=''}save();personDetail(p)}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
})();
